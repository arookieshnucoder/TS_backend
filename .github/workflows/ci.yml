name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 测试
        run: npm test
      - name: 构建
        run: npm run build
      - name: 构建 Docker 镜像
        run: docker build --tag ragagent-backend:ci .
      - name: 验证完整的堆栈配置
        run: docker compose --env-file deploy/.env.example -f compose.yml config --quiet
