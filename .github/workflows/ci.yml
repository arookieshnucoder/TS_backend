name: Backend CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_TEST_DATABASE_URL: postgresql://auth_test:ci-disposable-password@localhost:5432/auth_test
      POSTGRES_PASSWORD: ci-disposable-password
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auth_test
          POSTGRES_DB: auth_test
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_test -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 后端回归测试（不含 eval）
        run: npm test
      - name: 构建
        run: npm run build
      # eval 是手动运行的 Agent/Harness 评测平台，数据集和真实模型凭据不属于日常 CI。
      # 暂停日常 CI 的 Docker 镜像构建；仍保留后端回归测试、应用构建和 Compose 配置校验。
      - name: 验证完整的堆栈配置
        run: docker compose --env-file deploy/.env.example -f compose.yml config --quiet
