name: ${COMPOSE_PROJECT_NAME:-ragagent}
services:
  frontend:
    image: ${FRONTEND_IMAGE:-ragagent-frontend:local}
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  backend:
    image: ${BACKEND_IMAGE:-ragagent-backend:local}
    build:
      context: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_DATA_DIR: /app/data/sessions
      AUTH_ENABLED: "true"
      AUTH_DB_DRIVER: postgres
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: songjian
      PGDATABASE: songjian
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the launching environment}
      MATH_AGENT_VARIANT: general
      SCHOOL_SUBJECT: ${SCHOOL_SUBJECT:-math}
      ENGLISH_AGENT_VARIANT: ${ENGLISH_AGENT_VARIANT:-adaptive}
      ENGLISH_WORKFLOW: ${ENGLISH_WORKFLOW:-grounded}
      ENGLISH_THINKING: ${ENGLISH_THINKING:-disabled}
      ENGLISH_CONTEXT_TOKENS: ${ENGLISH_CONTEXT_TOKENS:-1800}
      ENGLISH_CORPUS_PATH: ${ENGLISH_CORPUS_PATH:-/app/evals/english/corpus.json}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-flash}
      ANSWER_REVIEW_ENABLED: ${ANSWER_REVIEW_ENABLED:-false}
      ANSWER_REVIEW_MODEL: ${ANSWER_REVIEW_MODEL:-glm-4.7}
      ANSWER_REVIEW_BASE_URL: ${ANSWER_REVIEW_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      ANSWER_REVIEW_API_KEY: ${ANSWER_REVIEW_API_KEY:-}
      ANSWER_REVIEW_TIMEOUT_MS: ${ANSWER_REVIEW_TIMEOUT_MS:-120000}
      ANSWER_REVIEW_MAX_REVISIONS: ${ANSWER_REVIEW_MAX_REVISIONS:-1}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-120000}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_FALLBACK_BASE_URL: ${LLM_FALLBACK_BASE_URL:-}
      LLM_FALLBACK_API_KEY: ${LLM_FALLBACK_API_KEY:-}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-32768}
      CONTEXT_CHUNK_TOKENS: ${CONTEXT_CHUNK_TOKENS:-512}
      CONTEXT_OVERLAP_RATIO: ${CONTEXT_OVERLAP_RATIO:-0.15}
      CONTEXT_COMPRESSION_TRIGGER: ${CONTEXT_COMPRESSION_TRIGGER:-0.65}
      CONTEXT_COMPRESSION_TARGET: ${CONTEXT_COMPRESSION_TARGET:-0.08}
      CONTEXT_TOKENIZER: ${CONTEXT_TOKENIZER:-cl100k_base}
      CONTEXT_TOKEN_SAFETY_FACTOR: ${CONTEXT_TOKEN_SAFETY_FACTOR:-1.2}
      AGENT_MAX_TOOL_STEPS: ${AGENT_MAX_TOOL_STEPS:-4}
      AGENT_MAX_CALLS_PER_STEP: ${AGENT_MAX_CALLS_PER_STEP:-4}
      AGENT_TOOL_TIMEOUT_MS: ${AGENT_TOOL_TIMEOUT_MS:-15000}
      AGENT_TOOL_OUTPUT_TOKENS: ${AGENT_TOOL_OUTPUT_TOKENS:-2048}
      AGENT_MODEL_RETRIES: ${AGENT_MODEL_RETRIES:-2}
      AGENT_TOOL_RETRIES: ${AGENT_TOOL_RETRIES:-1}
      AGENT_RETRY_BASE_DELAY_MS: ${AGENT_RETRY_BASE_DELAY_MS:-250}
      AGENT_RETRY_MAX_DELAY_MS: ${AGENT_RETRY_MAX_DELAY_MS:-3000}
      AGENT_MODEL_ATTEMPT_TIMEOUT_MS: ${AGENT_MODEL_ATTEMPT_TIMEOUT_MS:-30000}
      MCP_ADMIN_TOKEN: ${MCP_ADMIN_TOKEN:-}
      MCP_CONFIG_FILE: /app/runtime/mcp-servers.json
      MCP_TIMEOUT_MS: ${MCP_TIMEOUT_MS:-10000}
      AGENT_TRACE_ENABLED: ${AGENT_TRACE_ENABLED:-true}
      AGENT_RUN_DATA_DIR: /app/runtime/runs
      AGENT_TRACE_MAX_EVENTS: ${AGENT_TRACE_MAX_EVENTS:-512}
      AGENT_WORKSPACE_ENABLED: ${AGENT_WORKSPACE_ENABLED:-true}
      AGENT_WORKSPACE_ROOT: ${AGENT_WORKSPACE_ROOT:-.}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-chat-memory-v1}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      - sessions:/app/data/sessions
      - harness:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app
      - memory

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: songjian
      POSTGRES_DB: songjian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the launching environment}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U songjian -d songjian"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - memory

  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.19.0}
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 18
    networks:
      - memory

networks:
  app:
  memory:
    internal: true
volumes:
  postgres:
  sessions:
  harness:
  elasticsearch:
